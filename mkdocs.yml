site_name: MLOps Orchestration and Engineering
site_description: A comprehensive, hands-on roadmap for learning MLOps using Python-interactive scripts and local mock environments.
site_author: MLOps Learner

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: true  # it's okay to run full train and evals since the demos are small, as long as dvc and mlflow keep track of changes and versions of data and models
      include: ["src/**/**/*.py", "src/**/*.py", "src/*.py"]

hooks:
  - hooks/generate_tracker_data.py

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/tracker_header.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Live Tracking Dashboard: src/tracking_dashboard.py
  - "🛠️ Unified MLOps CLI Tutorial": src/mlops/cli.py
  - Setup:
    - "⚙️ Modern Python Env & Dependency Control with `uv`": src/setup_warmup/module_01_environment_uv/uv_guide.py
    - "📝 Notebook Documentation with Jupytext & MkDocs": src/setup_warmup/module_02_documentation/doc_guide.py
    - "☁️ Cloud Services Simulations and Mock Servers": src/setup_warmup/module_03_aws_simulation/cloud_sims.py
  - Data & Experiment Tracking:
    - "📦 Data Versioning with DVC": src/data_experimentation/module_04_data_versioning_dvc/dvc_guide.py
    - "🧪 Experiment Tracking & Model Registry with MLflow": src/data_experimentation/module_05_experiment_tracking_mlflow/mlflow_guide.py
    - "🔗 Integrated MLOps Pipeline (DVC + MLflow)": src/data_experimentation/module_06_integrated_pipeline/run_pipeline.py
  - Model Serving & Containers:
    - "🚀 Model Serving API with FastAPI": src/model_serving/module_07_model_serving/serve_api.py
    - "🐳 Model Deployment & Containerization with Docker": src/model_serving/module_08_containerization/docker_containerization.py
  - Production CI/CD & Monitoring:
    - "📈 Model Monitoring & Data Drift Detection with evidently": src/automation_observability/module_09_model_monitoring/drift_detection.py
    - "🛡️ Continuous Integration for Machine Learning (CI/ML)": src/automation_observability/module_10_ci_ml_automation/ci_ml_guide.py
    - "🤖 GitHub Actions CI Pipeline for MLOps": src/automation_observability/module_11_github_actions/github_actions_guide.py
    - "🧭 Pipeline Orchestration & DAGs (Airflow / Prefect)": src/automation_observability/module_12_pipeline_orchestration/orchestration_guide.py
  - Advanced MLOps:
    - "🗄️ Feature Store Implementation (Simulated Feast)": src/advanced_mlops/module_13_feature_store/feast_guide.py
    - "⚡ gRPC Serving, Batch Inference & Release Strategies": src/advanced_mlops/module_14_grpc_batch_release/grpc_guide.py
    - "🔄 Continuous Training (CT) & HITL Fallbacks": src/advanced_mlops/module_15_continuous_training/ct_guide.py
    - "🧠 LLMOps & Generative AI Pipelines": src/advanced_mlops/module_16_llmops/llmops_guide.py
    - "🛠️ Infrastructure as Code (IaC) & Advanced Containerization": src/advanced_mlops/module_17_iac_advanced_containers/iac_guide.py
    - "(Upcoming) 📊 Agile MLOps Lifecycle & Heuristic Baselines": src/advanced_mlops/module_18_agile_lifecycle/agile_guide.py


