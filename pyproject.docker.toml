[project]
name = "mlops"
version = "0.1.0"
description = "Containerized MLOps CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.28",
    "docker>=7.1.0",
    "dvc>=3.67.1",
    "evidently>=0.7.21",
    "fastapi>=0.136.3",
    "httpx2>=2.4.0",
    "litestar<2.23.0",
    "mlflow>=3.13.0",
    "moto[s3]>=5.2.2",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
mlops = "mlops.cli:main"

[tool.uv]
package = true
